<!DOCTYPE html>
<html>
<head>
  <title>Patient Master Form</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }
    label {
      display: inline-block;
      width: 150px;
      margin-bottom: 10px;
    }
    input {
      margin-bottom: 10px;
    }
    .error {
      color: red;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h2>Patient Master Form</h2>
  <form id="patientForm" onsubmit="return validateForm()">
    <label for="patientId">Patient ID:</label>
    <input type="text" id="patientId" name="patientId"><br>

    <label for="patientName">Patient Name:</label>
    <input type="text" id="patientName" name="patientName"><br>

    <label for="address">Address:</label>
    <input type="text" id="address" name="address"><br>

    <label for="city">City:</label>
    <input type="text" id="city" name="city"><br>

    <label for="contact">Contact Number:</label>
    <input type="text" id="contact" name="contact"><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob"><br>

    <button type="submit">Submit</button>
  </form>

  <div id="errorMessages" class="error"></div>
  <div id="submitData"></div>

  <script>
    function validateForm() {
      const patientId = document.getElementById("patientId").value.trim();
      const patientName = document.getElementById("patientName").value.trim();
      const address = document.getElementById("address").value.trim();
      const city = document.getElementById("city").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const dob = document.getElementById("dob").value;

      let errors = [];

      // Validation rules
      if (patientId === "") errors.push("Patient ID is required.");
      if (patientName === "" || !/^[A-Za-z ]+$/.test(patientName))
        errors.push("Valid Patient Name is required.");
      if (address === "") errors.push("Address is required.");
      if (city === "" || !/^[A-Za-z ]+$/.test(city))
        errors.push("Valid City name is required.");
      if (!/^\d{10}$/.test(contact))
        errors.push("Contact Number must be 10 digits.");
      if (!dob) {
        errors.push("Date of Birth is required.");
      } else {
        const dobDate = new Date(dob);
        const today = new Date();
        if (dobDate >= today)
          errors.push("Date of Birth must be in the past.");
      }

      // Show errors or submit
      const errorDiv = document.getElementById("errorMessages");
      if (errors.length > 0) {
        errorDiv.innerHTML = errors.join("<br>");
        return false;
      } else {
        errorDiv.innerHTML = "";
        
        return true;
      }
    }
  </script>

</body>
</html>
