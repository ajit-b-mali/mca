<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP Web Service Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>
        <p class="subtitle">Using a PHP Web Service</p>
        <form id="calculatorForm">
            <div>
                <label for="num1">First Number</label>
                <input type="number" id="num1" name="num1" step="any" required>
            </div>
            <div>
                <label for="num2">Second Number</label>
                <input type="number" id="num2" name="num2" step="any" required>
            </div>
            <div class="button-row">
                <button data-op="add" class="op-btn">+</button>
                <button data-op="subtract" class="op-btn">-</button>
                <button data-op="multiply" class="op-btn">&times;</button>
                <button data-op="divide" class="op-btn">&divide;</button>
            </div>
        </form>
        <div id="result-container">
            <p id="result-text">Result will be shown here</p>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('calculatorForm');
            const resultText = document.getElementById('result-text');
            const resultContainer = document.getElementById('result-container');
            const operationButtons = document.querySelectorAll('.op-btn');
            const webServiceUrl = 'calculator_ws.php';

            operationButtons.forEach(button => {
                button.addEventListener('click', async (event) => {
                    event.preventDefault();
                    const operation = event.target.dataset.op;
                    const formData = new FormData(form);
                    formData.append('operation', operation);

                    if (!formData.get('num1') || !formData.get('num2')) {
                        displayResult('Please enter both numbers.', true);
                        return;
                    }

                    try {
                        const response = await fetch(webServiceUrl, {
                            method: 'POST',
                            body: formData
                        });
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        const data = await response.json();
                        if (data.error) {
                            displayResult(data.message, true);
                        } else {
                            displayResult(`Result: ${data.result}`);
                        }
                    } catch (error) {
                        console.error('Fetch Error:', error);
                        displayResult('Error communicating with the server.', true);
                    }
                });
            });

            function displayResult(message, isError = false) {
                resultText.textContent = message;
                if (isError) {
                    resultContainer.classList.add('error');
                } else {
                    resultContainer.classList.remove('error');
                }
            }
        });
    </script>
</body>
</html>
