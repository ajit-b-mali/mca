<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Master Form</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="form-container">
        <h2>Patient Master Form</h2>

        <form id="patientForm" onsubmit="return validateForm()">
            <div>
                <label for="patientId">Patient ID</label>
                <input type="text" id="patientId" name="patientId" placeholder="e.g., P12345678">
            </div>

            <div>
                <label for="patientName">Patient Name</label>
                <input type="text" id="patientName" name="patientName" placeholder="e.g., John Doe">
            </div>

            <div>
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="e.g., 123 Main Street">
            </div>

            <div>
                <label for="city">City</label>
                <input type="text" id="city" name="city" placeholder="e.g., Anytown">
            </div>

            <div>
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" name="contact" placeholder="e.g., (123) 456-7890">
            </div>

            <div>
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>

            <button type="submit">Submit</button>
        </form>

        <div id="errorMessages" class="error"></div>
        <div id="submitData"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
