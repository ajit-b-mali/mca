<!DOCTYPE html>
<html>
<head>
  <title>Get Textbox Value using jQuery</title>
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <h2>Enter Your Name</h2>

  <input type="text" id="myInput" placeholder="Type your name here">
  <button id="getValueBtn">Get Value</button>

  <p id="output"></p>

  <script>
    $(document).ready(function() {
      $('#getValueBtn').click(function() {
        var inputVal = $('#myInput').val(); // Get the value
        $('#output').text("You entered: " + inputVal); // Display it
      });
    });
  </script>

</body>
</html>
