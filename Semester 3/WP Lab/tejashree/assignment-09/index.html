<!DOCTYPE html>
<html>
<head>
    <title>Get Textbox Value using jQuery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fafbfc;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        label {
            margin-bottom: 0.5em;
            font-size: 1rem;
        }
        input[type="text"] {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0.5em 0.8em;
            font-size: 1rem;
            outline: none;
            margin-right: 0.5em;
            background: #fff;
            transition: border 0.2s;
        }
        input[type="text"]:focus {
            border: 1.5px solid #0078d4;
        }
        button {
            background: #0078d4;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 0.5em 1.2em;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #005fa3;
        }
        #result {
            margin-top: 1.5em;
            font-size: 1.1rem;
            color: #444;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.7em;
            background: #fff;
            padding: 2em 2.5em;
            border-radius: 10px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body>
    <div class="container">
        <label for="myInput">Enter something:</label>
        <div>
            <input type="text" id="myInput">
            <button id="getValueBtn">Get Value</button>
        </div>
        <p id="result"></p>
    </div>
    <script>
        $(document).ready(function(){
            $("#getValueBtn").click(function(){
                var value = $("#myInput").val();
                $("#result").text("Value: " + value);
            });
        });
    </script>
</body>
</html>
